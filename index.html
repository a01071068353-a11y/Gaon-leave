<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fae7a"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="가온연차">
<title>가온어린이집 연차관리</title>
<style>
:root{--bg:#fbf8f1;--card:#fff;--ink:#2f3a2c;--sub:#7b8574;--g:#6fa66a;--gl:#e6f1e0;--bg2:#f3ecdc;--line:#e8e1d0;--red:#d9534f;--blue:#4a86c5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f241d;--card:#2a3027;--ink:#eef2e8;--sub:#a3ae9b;--g:#8cc487;--gl:#34402f;--bg2:#343a30;--line:#3d4539}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:17px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:23px;margin:4px 0 2px}h2{font-size:19px;margin:18px 0 8px}.sub{color:var(--sub);font-size:15px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:10px 0;border:1px solid var(--line)}
.hero{background:var(--gl);border-radius:24px;padding:16px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.grid4 div{background:var(--card);border-radius:14px;padding:10px;text-align:center;font-size:14px;color:var(--sub)}.grid4 b{display:block;font-size:20px;color:var(--ink)}
.rem{font-size:30px;font-weight:700;color:var(--g)}.rem.neg{color:var(--red)}
.nums{display:flex;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--sub);margin-top:6px}.nums b{color:var(--ink)}
input,select,textarea{width:100%;font:inherit;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);margin:4px 0 12px}
label{font-size:15px;color:var(--sub)}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;min-height:48px;background:var(--g);color:#fff;font-weight:600}
button.s{background:var(--bg2);color:var(--ink)}button.d{background:#fbe6e4;color:var(--red)}button.sm{min-height:38px;padding:7px 12px;font-size:15px}button.w{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--sub);font-size:12px;padding:6px 0;line-height:1.3;border-radius:12px}nav button span{display:block;font-size:22px}nav button.on{color:var(--g);background:var(--gl)}
.warn{background:#fff1d6;color:#8a5a00;border-radius:14px;padding:10px 12px;margin:8px 0;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal .h{text-align:center;font-size:13px;color:var(--sub);padding:4px 0}
.cal .c{min-height:62px;border-radius:10px;background:var(--card);border:1px solid var(--line);padding:3px;font-size:12px;overflow:hidden;cursor:pointer}.cal .c.sel{border:2px solid var(--g)}.cal .c.t{background:var(--gl)}.cal .c i{display:block;font-style:normal;font-size:11px;border-radius:5px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--bg2)}
.cal .c i.a{background:#d7e6f6;color:#24507d}.cal .c i.b{background:#d9efd5;color:#2c6a2a}.cal .c i.o{background:#f6e3c8;color:#7a5314}
.hist{border-top:1px solid var(--line);padding:10px 0}.hist:first-child{border:0}
.minus{color:var(--red);font-weight:700}.plus{color:var(--g);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}#mbox{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#333;color:#fff;padding:11px 18px;border-radius:20px;font-size:15px;z-index:30;display:none}
</style><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
</head><body><div id="app"></div>
<nav id="nav"></nav><div id="modal"><div id="mbox"></div></div><div id="toast"></div>
<script>
var KEY='gaon_leave_v1',db,tab='home',detail=null,q='',cm=null,selDay=null;
var $=function(i){return document.getElementById(i)},uid=function(){return Math.random().toString(36).slice(2,9)};
var r2=function(n){return Math.round(n*100)/100},esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var dot=function(d){return d.replace(/-/g,'.')},today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function seed(){var a=uid(),b=uid(),c=uid();return{v:1,settings:{name:'가온어린이집',year:2026,hours:8,base:15},
staff:[{id:a,name:'주디',hire:'',base:15,memo:'',active:true},{id:b,name:'나나',hire:'',base:15,memo:'',active:true},{id:c,name:'캐리',hire:'',base:15,memo:'',active:true}],
adj:[{id:uid(),sid:a,date:'2026-06-01',type:'add',days:2,reason:'대체휴무'}],
use:[{id:uid(),sid:a,date:'2026-08-10',type:'연차',days:1,hours:0,reason:'',memo:''},{id:uid(),sid:a,date:'2026-09-20',type:'오후반차',days:.5,hours:0,reason:'',memo:''}]}}
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}if(!db||!db.staff)db=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2200)}
function S(id){return db.staff.filter(function(s){return s.id==id})[0]}
function calc(s,y){var p=String(y),add=0,used=0;db.adj.forEach(function(a){if(a.sid==s.id&&a.date.indexOf(p)==0)add+=a.days});db.use.forEach(function(u){if(u.sid==s.id&&u.date.indexOf(p)==0)used+=u.days});
return{base:s.base,add:r2(add),used:r2(used),rem:r2(s.base+add-used)}}
function fmt(n){return(n>0?'+':'')+n}
function rv(n){return'<span class="rem'+(n<=0?' neg':'')+'">'+n+'일</span>'}
function modal(h){$('mbox').innerHTML=h;$('modal').className='on'}function closeM(){$('modal').className=''}
$('modal').onclick=function(e){if(e.target.id=='modal')closeM()};
function go(t){tab=t;detail=null;render();window.scrollTo(0,0)}
function render(){var Y=db.settings.year,nv=[['home','🏠','홈'],['cal','📅','달력'],['staff','👩','직원'],['reg','➕','연차등록'],['set','⚙️','설정']];
$('nav').innerHTML=nv.map(function(n){return'<button class="'+(tab==n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join('');
var h='';if(detail)h=vDetail();else if(tab=='home')h=vHome();else if(tab=='cal')h=vCal();else if(tab=='staff')h=vStaff();else if(tab=='reg')h=vReg();else h=vSet();$('app').innerHTML=h;if(tab=='reg'&&!detail)regChg();if(tab=='home'&&!detail)list()}
function act(){return db.staff.filter(function(s){return s.active})}
function vHome(){var Y=db.settings.year,t={base:0,add:0,used:0,rem:0},w='';act().forEach(function(s){var c=calc(s,Y);t.base+=c.base;t.add+=c.add;t.used+=c.used;t.rem+=c.rem;if(c.rem<=0)w+='<div class="warn">⚠️ 주의<br>'+esc(s.name)+' 선생님의 잔여 연차가 부족합니다. ('+c.rem+'일)</div>'});
return'<div class="hero"><h1>🌿 '+esc(db.settings.name)+'</h1><div class="sub">'+Y+'년 연차관리</div><div class="grid4"><div>총 직원<b>'+act().length+'명</b></div><div>총 발생<b>'+r2(t.base)+'일</b></div><div>총 추가<b>'+fmt(r2(t.add))+'일</b></div><div>총 사용<b>'+r2(t.used)+'일</b></div></div><div class="card row" style="margin-bottom:0"><span>총 잔여 연차</span>'+rv(r2(t.rem))+'</div></div>'+w+'<input id="q" placeholder="🔍 이름 검색" value="'+esc(q)+'" oninput="q=this.value;list()"><div id="list"></div>'}
function list(){var Y=db.settings.year,el=$('list');if(!el)return;var a=act().filter(function(s){return s.name.indexOf(q)>=0});
el.innerHTML=a.length?a.map(function(s){var c=calc(s,Y);return'<div class="card" onclick="openD(\''+s.id+'\')"><div class="row"><b>👩 '+esc(s.name)+' 선생님</b>'+rv(c.rem)+'</div><div class="nums"><span>발생 <b>'+c.base+'일</b></span><span>추가 <b>'+fmt(c.add)+'일</b></span><span>사용 <b>-'+c.used+'일</b></span></div></div>'}).join(''):'<div class="card sub">직원이 없습니다. 👩 직원 메뉴에서 추가해 주세요.</div>'}
function openD(id){detail=id;render();window.scrollTo(0,0)}
function vDetail(){var s=S(detail),Y=db.settings.year,c=calc(s,Y),p=String(Y),h=[];
db.adj.forEach(function(a){if(a.sid==s.id&&a.date.indexOf(p)==0)h.push({k:'a',d:a.date,o:a})});db.use.forEach(function(u){if(u.sid==s.id&&u.date.indexOf(p)==0)h.push({k:'u',d:u.date,o:u})});
h.sort(function(a,b){return a.d<b.d?1:-1});var an={add:'추가',deduct:'차감',other:'조정'};
return'<button class="s sm" onclick="detail=null;render()">← 뒤로</button><h1 style="margin-top:12px">👩 '+esc(s.name)+' 선생님</h1><div class="sub">'+Y+'년'+(s.memo?' · '+esc(s.memo):'')+'</div><div class="card"><div class="row"><span>기본 연차</span><b>'+c.base+'일</b></div><div class="row"><span>추가 연차</span><b>'+fmt(c.add)+'일</b></div><div class="row"><span>사용 연차</span><b>-'+c.used+'일</b></div><hr style="border:0;border-top:1px solid var(--line)"><div class="row"><span>잔여 연차</span>'+rv(c.rem)+'</div></div><div class="btns"><button onclick="openAdj(\''+s.id+'\')">➕ 연차 조정</button><button class="s" onclick="openUse(\''+s.id+'\')">📝 사용 등록</button></div><h2>내역 (최신순)</h2><div class="card">'+(h.length?h.map(function(x){var o=x.o,l;if(x.k=='a'){l='<span class="'+(o.days>=0?'plus':'minus')+'">'+an[o.type]+' '+fmt(o.days)+'일</span> '+esc(o.reason)}else{l='<span class="minus">'+esc(o.type)+' -'+o.days+'일</span>'+(o.type=='시간연차'?' ('+o.hours+'시간)':'')+' '+esc(o.reason)+(o.memo?' <span class="sub">'+esc(o.memo)+'</span>':'')}
return'<div class="hist"><div class="row"><b>'+dot(x.d)+'</b><span class="btns"><button class="s sm" onclick="'+(x.k=='a'?'openAdj(\''+s.id+'\',\''+o.id+'\')':'openUse(\''+s.id+'\',\''+o.id+'\')')+'">수정</button><button class="d sm" onclick="del(\''+x.k+'\',\''+o.id+'\')">삭제</button></span></div><div>'+l+'</div></div>'}).join(''):'<div class="sub">내역이 없습니다.</div>')+'</div>'}
function del(k,id){if(!confirm('정말 삭제하시겠습니까?'))return;if(k=='a')db.adj=db.adj.filter(function(x){return x.id!=id});else db.use=db.use.filter(function(x){return x.id!=id});save();render();toast('삭제했습니다')}
/* 연차 사용 폼 */
function useForm(sid,rec){var o=rec||{type:'연차',date:today(),days:1,hours:2,reason:'',memo:''},T=['연차','오전반차','오후반차','시간연차','기타'];
return'<label>직원</label><select id="u_s">'+act().map(function(s){return'<option value="'+s.id+'"'+(s.id==sid?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select><label>사용 날짜</label><input type="date" id="u_d" value="'+o.date+'"><label>사용 유형</label><select id="u_t" onchange="regChg()">'+T.map(function(t){return'<option'+(t==o.type?' selected':'')+'>'+t+'</option>'}).join('')+'</select><div id="u_h" style="display:none"><label>사용 시간 (시간)</label><input type="number" step="0.5" min="0" id="u_hr" value="'+o.hours+'" oninput="regChg()"></div><div id="u_x" style="display:none"><label>사용 일수</label><input type="number" step="0.25" min="0" id="u_dy" value="'+o.days+'" oninput="regChg()"></div><div class="card row" style="margin-top:0"><span>차감 일수</span><b id="u_p"></b></div><label>사유</label><input id="u_r" value="'+esc(o.reason)+'"><label>메모</label><input id="u_m" value="'+esc(o.memo)+'">'}
function regChg(){var t=$('u_t');if(!t)return;t=t.value;$('u_h').style.display=t=='시간연차'?'block':'none';$('u_x').style.display=t=='기타'?'block':'none';$('u_p').textContent=uDays()+'일'}
function uDays(){var t=$('u_t').value;if(t=='연차')return 1;if(t.indexOf('반차')>0)return .5;if(t=='시간연차')return r2((+$('u_hr').value||0)/db.settings.hours);return r2(+$('u_dy').value||0)}
function vReg(){var s=act();return'<h1>📝 연차 등록</h1><div class="sub">연차 · 반차 · 시간연차</div><div class="card">'+(s.length?useForm(s[0].id)+'<button class="w" onclick="saveUse()">저장</button>':'먼저 직원을 등록해 주세요.')+'</div>'}
function openUse(sid,id){var rec=id?db.use.filter(function(x){return x.id==id})[0]:null;modal('<h2 style="margin-top:0">'+(id?'연차 수정':'연차 등록')+'</h2>'+useForm(sid,rec)+'<div class="btns"><button class="s" onclick="closeM()">취소</button><button onclick="saveUse(\''+(id||'')+'\')">저장</button></div>');regChg()}
function saveUse(id){var sid=$('u_s').value,d=$('u_d').value,t=$('u_t').value,dy=uDays();if(!d)return alert('날짜를 입력해 주세요.');if(dy<=0)return alert('사용 일수를 입력해 주세요.');
var s=S(sid),c=calc(s,d.slice(0,4)),old=id?db.use.filter(function(x){return x.id==id})[0]:null,avail=c.rem+(old&&old.sid==sid&&old.date.slice(0,4)==d.slice(0,4)?old.days:0);
if(dy>avail&&!confirm('사용 가능한 연차보다 많은 일수를 입력했습니다. 그래도 등록하시겠습니까?'))return;
var rec={id:id||uid(),sid:sid,date:d,type:t,days:dy,hours:t=='시간연차'?+$('u_hr').value:0,reason:$('u_r').value,memo:$('u_m').value};
if(id)db.use=db.use.map(function(x){return x.id==id?rec:x});else db.use.push(rec);save();closeM();var n=calc(s,d.slice(0,4));toast(s.name+' 잔여 '+n.rem+'일');
if(n.rem<=0)setTimeout(function(){alert('⚠️ 주의\n'+s.name+' 선생님의 잔여 연차가 부족합니다.')},300);render()}
/* 연차 조정 */
function openAdj(sid,id){var o=id?db.adj.filter(function(x){return x.id==id})[0]:{type:'add',date:today(),days:1,reason:''},ty=[['add','연차 추가'],['deduct','연차 차감'],['other','기타 조정 (음수 가능)']];
modal('<h2 style="margin-top:0">'+(id?'조정 수정':'연차 조정')+'</h2><label>직원</label><select id="a_s">'+act().map(function(s){return'<option value="'+s.id+'"'+(s.id==(sid||o.sid)?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select><label>조정 유형</label><select id="a_t">'+ty.map(function(t){return'<option value="'+t[0]+'"'+(t[0]==o.type?' selected':'')+'>'+t[1]+'</option>'}).join('')+'</select><label>일수</label><input type="number" step="0.25" id="a_d" value="'+(o.type=='deduct'?-o.days:o.days)+'"><label>날짜</label><input type="date" id="a_dt" value="'+o.date+'"><label>사유 (필수)</label><input id="a_r" value="'+esc(o.reason)+'" placeholder="예: 대체휴무"><div class="btns"><button class="s" onclick="closeM()">취소</button><button onclick="saveAdj(\''+(id||'')+'\')">저장</button></div>')}
function saveAdj(id){var t=$('a_t').value,v=+$('a_d').value,r=$('a_r').value.trim();if(!v)return alert('일수를 입력해 주세요.');if(!r)return alert('사유를 입력해 주세요.');
var days=t=='add'?Math.abs(v):t=='deduct'?-Math.abs(v):v,rec={id:id||uid(),sid:$('a_s').value,date:$('a_dt').value||today(),type:t,days:days,reason:r};
if(id)db.adj=db.adj.map(function(x){return x.id==id?rec:x});else db.adj.push(rec);save();closeM();toast('저장했습니다 · 잔여 '+calc(S(rec.sid),rec.date.slice(0,4)).rem+'일');render()}
/* 직원 */
function vStaff(){return'<div class="row"><h1>👩 직원</h1><button onclick="openStaff()">＋ 추가</button></div>'+db.staff.map(function(s){var c=calc(s,db.settings.year);return'<div class="card" style="'+(s.active?'':'opacity:.55')+'"><div class="row" onclick="openD(\''+s.id+'\')"><b>'+esc(s.name)+(s.active?'':' (퇴직)')+'</b>'+rv(c.rem)+'</div><div class="sub">입사 '+(s.hire?dot(s.hire):'-')+' · 기본 '+s.base+'일'+(s.memo?' · '+esc(s.memo):'')+'</div><div class="btns" style="margin-top:8px"><button class="s sm" onclick="openStaff(\''+s.id+'\')">수정</button><button class="d sm" onclick="delStaff(\''+s.id+'\')">삭제</button></div></div>'}).join('')}
function openStaff(id){var o=id?S(id):{name:'',hire:'',base:db.settings.base,memo:'',active:true};
modal('<h2 style="margin-top:0">'+(id?'직원 수정':'직원 추가')+'</h2><label>이름</label><input id="s_n" value="'+esc(o.name)+'"><label>입사일</label><input type="date" id="s_h" value="'+o.hire+'"><label>기본 연차 (일)</label><input type="number" step="0.5" id="s_b" value="'+o.base+'"><label>메모</label><input id="s_m" value="'+esc(o.memo)+'"><label>재직 여부</label><select id="s_a"><option value="1"'+(o.active?' selected':'')+'>재직</option><option value="0"'+(o.active?'':' selected')+'>퇴직</option></select><div class="btns"><button class="s" onclick="closeM()">취소</button><button onclick="saveStaff(\''+(id||'')+'\')">저장</button></div>')}
function saveStaff(id){var n=$('s_n').value.trim();if(!n)return alert('이름을 입력해 주세요.');var rec={id:id||uid(),name:n,hire:$('s_h').value,base:+$('s_b').value||0,memo:$('s_m').value,active:$('s_a').value=='1'};
if(id)db.staff=db.staff.map(function(x){return x.id==id?rec:x});else db.staff.push(rec);save();closeM();render();toast('저장했습니다')}
function delStaff(id){if(!confirm('정말 삭제하시겠습니까?\n이 직원의 모든 연차 기록도 함께 삭제됩니다.'))return;db.staff=db.staff.filter(function(x){return x.id!=id});db.adj=db.adj.filter(function(x){return x.sid!=id});db.use=db.use.filter(function(x){return x.sid!=id});save();render()}
/* 달력 */
function vCal(){var n=new Date();if(!cm)cm=[n.getFullYear(),n.getMonth()];var y=cm[0],m=cm[1],f=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),ms=y+'-'+String(m+1).padStart(2,'0')+'-',h='<div class="row"><button class="s sm" onclick="cmv(-1)">◀</button><h1>'+y+'년 '+(m+1)+'월</h1><button class="s sm" onclick="cmv(1)">▶</button></div><div class="cal">'+['월','화','수','목','금','토','일'].map(function(d){return'<div class="h">'+d+'</div>'}).join('');
for(var i=0;i<f;i++)h+='<div></div>';for(var d=1;d<=dim;d++){var ds=ms+String(d).padStart(2,'0'),us=db.use.filter(function(u){return u.date==ds&&S(u.sid)});h+='<div class="c'+(ds==today()?' t':'')+(ds==selDay?' sel':'')+'" onclick="selDay=\''+ds+'\';render()"><b>'+d+'</b>'+us.slice(0,2).map(function(u){return'<i class="'+(u.type=='연차'?'a':u.type.indexOf('반차')>0?'b':'o')+'">'+esc(S(u.sid).name)+'</i>'}).join('')+(us.length>2?'<i>+'+(us.length-2)+'</i>':'')+'</div>'}
h+='</div><div class="sub" style="margin-top:8px">🔵 연차 · 🟢 반차 · 🟠 시간/기타</div>';
if(selDay){var l=db.use.filter(function(u){return u.date==selDay&&S(u.sid)});h+='<div class="card"><b>'+dot(selDay)+'</b>'+(l.length?l.map(function(u){return'<div class="hist">'+(u.type=='연차'?'🔵':u.type.indexOf('반차')>0?'🟢':'🟠')+' '+esc(S(u.sid).name)+' - '+esc(u.type)+' ('+u.days+'일)'+(u.reason?' · '+esc(u.reason):'')+'</div>'}).join(''):'<div class="sub">연차 사용자가 없습니다.</div>')+'</div>'}return h}
function cmv(d){cm[1]+=d;if(cm[1]<0){cm[1]=11;cm[0]--}if(cm[1]>11){cm[1]=0;cm[0]++}render()}
/* 설정 */
function vSet(){var s=db.settings;return'<h1>⚙️ 설정</h1><div class="card"><label>어린이집 이름</label><input id="c_n" value="'+esc(s.name)+'"><label>연도 (연도별로 데이터가 따로 계산됩니다)</label><div class="row"><button class="s sm" onclick="yr(-1)">◀</button><b style="font-size:22px">'+s.year+'년</b><button class="s sm" onclick="yr(1)">▶</button></div><br><label>1일 근무시간 (시간연차 계산 기준)</label><input type="number" step="0.5" id="c_h" value="'+s.hours+'"><label>새 직원 기본 연차 (일)</label><input type="number" step="0.5" id="c_b" value="'+s.base+'"><div class="sub" style="margin-bottom:10px">계산 방식: 잔여 = 기본 + 추가 − 사용</div><button class="w" onclick="saveSet()">설정 저장</button></div><div class="card"><div class="btns"><button onclick="openAdj()">➕ 연차 추가/차감</button><button class="s" onclick="go(\'staff\')">👩 직원 관리</button></div></div><div class="card"><b>💾 데이터 백업 / 복구</b><div class="sub" style="margin:4px 0 8px">아래 내용을 복사해 카카오톡 \'나에게\' 등에 보관해 두세요.</div><button class="w s" onclick="bk()">백업 내용 만들기</button><textarea id="bk" rows="4" style="margin-top:8px" placeholder="백업 내용 / 복구할 내용을 붙여넣기"></textarea><div class="btns"><button class="s" onclick="cp()">복사</button><button class="d" onclick="rs()">복구하기</button></div></div>'}
function yr(d){db.settings.year+=d;save();render()}
function saveSet(){var s=db.settings;s.name=$('c_n').value||'가온어린이집';s.hours=+$('c_h').value||8;s.base=+$('c_b').value||15;save();toast('저장했습니다')}
function bk(){$('bk').value=JSON.stringify(db)}
function cp(){var t=$('bk');if(!t.value)bk();t.select();try{navigator.clipboard.writeText(t.value);toast('복사했습니다')}catch(e){document.execCommand('copy');toast('복사했습니다')}}
function rs(){var v=$('bk').value.trim();try{var d=JSON.parse(v);if(!d.staff||!d.adj||!d.use)throw 0;if(!confirm('현재 데이터를 지우고 복구합니다. 진행할까요?'))return;db=d;save();render();toast('복구했습니다')}catch(e){alert('백업 내용이 올바르지 않습니다.')}}
load();save();render();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script></body></html>
